services:
  db:
    image: postgres:16
    container_name: training-reminder-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: training_user
      POSTGRES_PASSWORD: local_dev_password
      POSTGRES_DB: training_reminder
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U training_user -d training_reminder"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: training-reminder-redis
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://training_user:local_dev_password@db:5432/training_reminder
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8080
      MICROSOFT_REDIRECT_URI: http://localhost:8080/api/auth/microsoft/callback
    command: alembic upgrade head
    depends_on:
      db:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    container_name: training-reminder-api
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://training_user:local_dev_password@db:5432/training_reminder
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8080
      MICROSOFT_REDIRECT_URI: http://localhost:8080/api/auth/microsoft/callback
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    build:
      context: ./backend
    container_name: training-reminder-worker
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://training_user:local_dev_password@db:5432/training_reminder
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8080
      MICROSOFT_REDIRECT_URI: http://localhost:8080/api/auth/microsoft/callback
    command: celery -A app.celery_app:celery_app worker --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  beat:
    build:
      context: ./backend
    container_name: training-reminder-beat
    restart: unless-stopped
    env_file:
      - ./backend/.env
    environment:
      DATABASE_URL: postgresql+asyncpg://training_user:local_dev_password@db:5432/training_reminder
      REDIS_URL: redis://redis:6379/0
      FRONTEND_URL: http://localhost:8080
      MICROSOFT_REDIRECT_URI: http://localhost:8080/api/auth/microsoft/callback
    command: celery -A app.celery_app:celery_app beat --loglevel=info
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
    container_name: training-reminder-frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data:
